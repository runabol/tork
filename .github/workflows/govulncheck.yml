name: govulncheck

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - LICENSE
      - "docker-compose.yml"
      - ".github/ISSUE_TEMPLATE/*.yml"
      - ".github/dependabot.yml"
      - ".github/release-drafter.yml"
  pull_request:
    branches:
      - "*"
    paths-ignore:
      - "**.md"
      - LICENSE
      - "docker-compose.dev.yml"
      - ".github/ISSUE_TEMPLATE/*.yml"
      - ".github/dependabot.yml"
      - ".github/release-drafter.yml"

jobs:
  govulncheck-check:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
          check-latest: true
          cache: false

      - name: Install Govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Govulncheck
        run: |
          findings=$(mktemp)
          govulncheck -format json ./... > "$findings"; rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi
          # unreviewed advisories carry no symbol data, so they match every
          # importer regardless of reachability; gate on the reviewed ones
          affected=$(jq -rs '
            (map(select(.osv.database_specific.review_status == "REVIEWED") | .osv.id) | unique) as $reviewed
            | [ .[] | select(.finding.trace[0].function) | .finding.osv ]
            | unique | map(select(IN($reviewed[]))) | .[]
          ' "$findings")
          if [ -n "$affected" ]; then
            printf 'reachable reviewed vulnerabilities:\n%s\n' "$affected"
            govulncheck ./...
          fi
